[package]
name = "jevbus"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Joie <69368441+zkjoie@users.noreply.github.com>"]
description = "A streaming event bus whose routing, subscription and consumption are decided by a probabilistic judge such as TypeSafe AI's Jev"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zkjoie/jevbus"
homepage = "https://github.com/zkjoie/jevbus"
documentation = "https://docs.rs/jevbus"
keywords = ["event-bus", "pubsub", "stream", "routing", "jev"]
categories = ["asynchronous", "concurrency", "api-bindings"]
exclude = [".env", ".env.example", "/.github", "/target"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["jev"]
# HTTP adapter for TypeSafe AI's Jev model. Needs a tokio runtime.
jev = ["dep:reqwest", "dep:serde_json", "tokio"]
# `TokioSleeper`, the tokio-backed timer for retries, timeouts and merge windows.
tokio = ["dep:tokio"]

[dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", optional = true, default-features = false, features = ["time"] }

[dev-dependencies]
dotenvy = "0.15"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[[example]]
name = "stream"
required-features = ["jev"]

[[example]]
name = "merge"
required-features = ["jev"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
